name: v0.27 generate final CGA atlas and source tests
on:
  push:
    branches: [feat/v027-1942-plane-recoil]
    paths: ['.github/workflows/v027-generate.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate compact 32x24 plane and HUD font
        run: python tools/build_cga_assets.py
      - name: Assemble and test Intel 8086
        run: |
          make clean all test
          make build/TANKS-TRACE.COM build/TANKS-PERF.COM
      - name: Commit reproducible generated CGA atlas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dos/cga_assets.inc
          git commit -m 'art(v0.27): generate 32x24 plane frames and BURIM CGA font glyph' || exit 0
          git push origin HEAD:feat/v027-1942-plane-recoil
