name: Expand v0.24 reviewed source patch
on:
  push:
    branches: [feat/v024-coop-loops-treads]
    paths: [tools/v024-source.patch.gz.b64]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed 8086 changes on clean v0.23 baseline
        run: |
          base64 -d tools/v024-source.patch.gz.b64 | gzip -dc | patch --batch -p1
          python tools/build_cga_assets.py
          make clean all test
          make build/TANKS-TRACE.COM build/TANKS-PERF.COM
          test "$(wc -c < build/TANKS.COM)" -lt 57344
      - name: Publish complete source as a normal Git commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile src/dos tests
          git rm tools/v024-source.patch.gz.b64
          git commit -m "feat(v0.24): P2 coop, armored tracks, anti-loop AI and enemy laser tests"
          git push origin HEAD:feat/v024-coop-loops-treads
