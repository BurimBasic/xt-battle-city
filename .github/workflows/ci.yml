name: DOS 8086 CGA prototype and map tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble 8086 DOS COM programs
        run: make clean all
      - name: Unit tests, map and 8086 ISA audit
        run: make test
      - name: Verify compact 8086 programs
        run: |
          test "$(wc -c < build/XTINFO.COM)" -lt 16384
          test "$(wc -c < build/TANKS.COM)" -lt 49152
      - uses: actions/upload-artifact@v4
        with:
          name: dos-cga-tanks-prototype-and-diagnostic
          path: |
            build/TANKS.COM
            build/XTINFO.COM
      - uses: actions/upload-artifact@v4
        with:
          name: xt-battle-city-source-snapshot
          path: |
            src/
            tools/
            tests/
            assets/
            docs/
            Makefile
            README.md
            CHANGELOG.md
          retention-days: 7
