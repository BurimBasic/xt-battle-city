name: Import tested v0.25 8086 source
on:
  push:
    branches: [feat/v025-bomber-coop-feedback]
    paths: [tools/v025-source.patch.gz.b64]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch and verify 8086 binary
        run: |
          base64 -d tools/v025-source.patch.gz.b64 | gzip -dc | patch --batch -p1
          python tools/build_cga_assets.py
          make clean all test
          make build/TANKS-TRACE.COM build/TANKS-PERF.COM
          test "$(wc -c < build/TANKS.COM)" -lt 57344
      - name: Publish complete reviewed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile src/dos tools/build_cga_assets.py tests
          git rm tools/v025-source.patch.gz.b64
          git commit -m "feat(v0.25): bomber flyby, three lives, coop respawns and pickup visibility"
          git push origin HEAD:feat/v025-bomber-coop-feedback
